<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#355f49">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Track household emergency supplies, chosen optimum levels, family meals and water reserves.">
  <title>Home Reserves — Emergency Inventory</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div><div class="eyebrow">✦ YOUR HOME, PREPARED</div><h1>Home Reserves</h1><p class="subtitle">A calmer way to keep everything in stock.</p></div>
      <button id="quickAdd" class="primary" type="button">＋ Add item</button>
    </header>
    <nav class="nav" aria-label="Main navigation">
      <button type="button" data-tab="overview"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg><span>Dashboard</span></button>
      <button type="button" data-tab="inventory"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M9 5v5M15 5v5"/></svg><span>Inventory</span></button>
      <button type="button" data-tab="meals"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18M7 15h3M14 15h3"/></svg><span>Planner</span></button>
      <button type="button" data-tab="settings"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg><span>Settings</span></button>
    </nav>

    <div id="message" aria-live="polite"></div>
    <div id="screen"></div>
    <p class="footer-note">Data is saved on this device only. Export a backup regularly, especially before changing your phone.</p>
  </main>
  <dialog id="editor" aria-label="Edit record"><div id="editorBody"></div></dialog>
  <script src="../events.js" defer></script>
  <script src="./recipe-library.js" defer></script>
  <script src="./planner.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
