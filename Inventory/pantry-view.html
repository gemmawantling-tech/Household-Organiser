<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantry view — Home Reserves</title><link rel="stylesheet" href="./app.css"><style>
.pantries{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.shelf{background:#e9e1d1;border:2px solid #b9a78b;border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 6px 0 #b9a78b}.shelf h3{margin:0 0 10px}.jars{display:flex;gap:7px;flex-wrap:wrap}.jar{background:white;border:1px solid #d4d0c5;border-radius:9px;padding:9px 7px;min-width:88px;max-width:155px;flex:1;text-align:center;font-size:.8rem;overflow-wrap:anywhere}.jar.low{border:2px solid #bd8b40;background:#fff8eb}.jar strong{display:block;font-size:1.05rem}.pill{font-size:.75rem;color:#667}.empty-shelf{color:#68756b;font-size:.85rem}.toplinks{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
</style></head><body><main class="app"><div class="toplinks"><h1>My pantry shelves</h1><a href="./index.html">← Back to inventory</a></div><p class="muted">A visual view of food already recorded in Home Reserves. This does not change your stock.</p><div class="card"><label for="place">Storage location</label><select id="place"></select><p id="summary" class="small muted"></p></div><div id="pantries" class="pantries"></div><p class="small muted">Shelf groups are based on inventory categories and item names, not physical shelf positions. Set each item's Storage location in Inventory to organise by cupboard.</p></main><script>
'use strict';
const key='home_reserves_inventory_v1';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}
const all=(data?.items||[]).filter(i=>(data.categories||[]).find(c=>c.id===i.category)?.type==='food');
const place=document.getElementById('place'),container=document.getElementById('pantries');
const locations=[...new Set(all.map(i=>(i.location||'Unassigned').trim()||'Unassigned'))].sort();
place.innerHTML='<option value="all">All pantry locations</option>'+locations.map(x=>'<option value="'+safe(x)+'">'+safe(x)+'</option>').join('');
function group(i){const n=String(i.name||'').toLowerCase();if(/pasta|rice|noodle|oat|cereal|lentil|flour|grain/.test(n))return 'Pasta, rice & grains';if(/bean|tomato|passata|soup|pea|sweetcorn|pepper|tin/.test(n))return 'Tins & jars';if(/sauce|oil|soy|peanut|spice|coffee|syrup/.test(n))return 'Sauces & essentials';return 'Other food';}
function render(){const selected=place.value,items=all.filter(i=>selected==='all'||(i.location||'Unassigned').trim()===selected);document.getElementById('summary').textContent=items.length+' food item types shown';const groups=['Pasta, rice & grains','Tins & jars','Sauces & essentials','Other food'];container.innerHTML=groups.map(g=>{const entries=items.filter(i=>group(i)===g);return '<section class="shelf"><h3>'+g+'</h3><div class="jars">'+(entries.length?entries.map(i=>{const n=i.current===null||i.current===undefined?'Not counted':i.current+' '+safe(i.unit||'');const low=i.optimum!==null&&i.optimum!==undefined&&i.current!==null&&i.current!==undefined&&Number(i.current)<Number(i.optimum);return '<div class="jar'+(low?' low':'')+'"><strong>'+safe(i.name)+'</strong><span>'+n+'</span>'+(low?'<div class="pill">Below target</div>':'')+'</div>'}).join(''):'<span class="empty-shelf">Nothing recorded</span>')+'</div></section>'}).join('')}
place.addEventListener('change',render);render();
</script></body></html>
