<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#285b49"><title>My pantry · Home Reserves</title><link rel="stylesheet" href="./app.css"><style>
.pantry-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 22px}.back{color:#285b49;text-decoration:none;font-weight:750}.pantry-head h1{font-size:2.2rem;margin:9px 0}
.pantry-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.pantry-controls label{font-size:.78rem}.pantry-controls input,.pantry-controls select{background:white}
.summary-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 24px}.summary-strip>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.summary-strip strong{display:block;font-size:1.6rem}.summary-strip span{font-size:.74rem;color:var(--muted)}
.shelf-unit{margin:0 0 27px}.shelf-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.shelf-heading h2{margin:0}.shelf-heading small{color:var(--muted)}
.shelf-cabinet{background:linear-gradient(90deg,#d4b99b,#eee0cb 5%,#f2e8d8 95%,#d1b08b);border:10px solid #b99672;border-bottom-width:14px;border-radius:13px 13px 6px 6px;box-shadow:inset 0 6px 12px #7350321c,0 9px 0 #a77e58,0 17px 25px #553f2722;padding:18px 12px 4px}
.shelf-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));align-items:end;gap:13px 8px;min-height:135px;padding:7px 3px 15px;border-bottom:12px solid #b58c63;box-shadow:0 5px 0 #8d6847;margin-bottom:17px}
.product{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:end;text-align:center;min-height:116px;min-width:0;padding:0;cursor:pointer;color:#243b31}
.product-art{display:grid;place-items:center;position:relative;width:65px;height:75px;background:linear-gradient(90deg,#e9f0e6,#fff 25%,#fff 75%,#e5e9dc);border:2px solid #d4d7cb;border-radius:9px 9px 13px 13px;box-shadow:3px 5px 0 #604b3720;font-size:1.7rem;margin-bottom:7px}
.product[data-shape="tin"] .product-art{width:58px;height:66px;border-radius:12px 12px 9px 9px;background:linear-gradient(90deg,#b9c7bc,#f8faf4 22%,#e4eee5 78%,#acbcae)}
.product[data-shape="bottle"] .product-art{width:48px;height:82px;border-radius:10px 10px 16px 16px}
.product[data-shape="pack"] .product-art{height:73px;width:64px;border-radius:5px;background:linear-gradient(120deg,#e5d6b9,#fff5e1 60%,#d5c4a6)}
.product[data-shape="jar"] .product-art{height:62px;width:59px;border-radius:12px 12px 16px 16px;background:linear-gradient(90deg,#d7e0c9,#f8f5e8 35%,#d2ddc9)}
.product-name{font-weight:750;font-size:.75rem;line-height:1.2;max-width:110px;overflow-wrap:anywhere}.product-count{font-size:.72rem;margin-top:4px;color:#526354}
.product.is-low .product-art{border-color:#b97e36;box-shadow:0 0 0 3px #efce8b,3px 5px 0 #604b3720}.product.is-low .product-count{color:#945c20;font-weight:800}
.product.is-empty{opacity:.6}.empty-shelf{padding:20px 4px;color:#7c6d59;font-size:.87rem}
.pantry-footer{font-size:.78rem;color:var(--muted);line-height:1.5}.product:focus-visible{outline:3px solid #285b49;outline-offset:6px;border-radius:8px}
@media(max-width:440px){.pantry-controls{grid-template-columns:1fr}.summary-strip>div{padding:10px}.summary-strip strong{font-size:1.3rem}.shelf-cabinet{padding:12px 6px 2px}.shelf-products{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 5px}}
</style></head><body><main class="app"><div class="pantry-head"><div><a class="back" href="./index.html">← Home Reserves</a><h1>My pantry</h1><p class="subtitle">See what's on your shelves, at a glance.</p></div><div class="feature-icon" aria-hidden="true">▤</div></div>
<section class="card"><div class="pantry-controls"><div><label for="place">Cupboard or location</label><select id="place"></select></div><div><label for="search">Find something</label><input id="search" type="search" placeholder="Search your pantry"></div></div><p class="hint">Tap any item to open its details in your stock list.</p></section>
<div id="summary" class="summary-strip" aria-live="polite"></div><div id="pantries"></div><p class="pantry-footer">The shelves are a visual grouping of your recorded food, not an exact floor plan. Add cupboard locations when editing stock. Your data remains on this device.</p></main>
<script>
'use strict';
const KEY='home_reserves_inventory_v1',safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}
const all=(data?.items||[]).filter(i=>(data.categories||[]).find(c=>c.id===i.category)?.type==='food');
const place=document.getElementById('place'),search=document.getElementById('search'),container=document.getElementById('pantries');
const locations=[...new Set(all.map(i=>(i.location||'Unassigned').trim()||'Unassigned'))].sort();
place.innerHTML='<option value="all">All locations</option>'+locations.map(x=>'<option value="'+safe(x)+'">'+safe(x)+'</option>').join('');
function group(i){const n=String(i.name||'').toLowerCase();if(/pasta|rice|noodle|oat|cereal|lentil|flour|grain/.test(n))return 'Grains & breakfast';if(/bean|tomato|passata|soup|pea|sweetcorn|pepper|tin/.test(n))return 'Tins & cupboard staples';if(/sauce|oil|soy|peanut|spice|coffee|syrup/.test(n))return 'Sauces & essentials';return 'Snacks & other food'}
function art(i){const n=(i.name||'').toLowerCase();return /coffee/.test(n)?'☕':/milk/.test(n)?'🥛':/rice/.test(n)?'🍚':/pasta|noodle/.test(n)?'🍝':/bean|lentil/.test(n)?'🫘':/tomato|passata/.test(n)?'🍅':/oil/.test(n)?'🫒':/cereal|oat/.test(n)?'🌾':/soup/.test(n)?'🥣':/peanut/.test(n)?'🥜':/fruit/.test(n)?'🍎':/bar|biscuit|cracker/.test(n)?'🍪':'🥫'}
function shape(i){const u=(i.unit||'').toLowerCase();return /tin|can/.test(u)?'tin':/bottle|litre|carton/.test(u)?'bottle':/jar/.test(u)?'jar':'pack'}
function render(){const items=all.filter(i=>(place.value==='all'||(i.location||'Unassigned').trim()===place.value)&&i.name.toLowerCase().includes(search.value.trim().toLowerCase()));const low=items.filter(i=>i.current!=null&&i.optimum!=null&&Number(i.current)<Number(i.optimum)).length,uncounted=items.filter(i=>i.current==null).length;
document.getElementById('summary').innerHTML='<div><strong>'+items.length+'</strong><span>Products</span></div><div><strong>'+low+'</strong><span>To top up</span></div><div><strong>'+uncounted+'</strong><span>Not counted</span></div>';
const groups=['Grains & breakfast','Tins & cupboard staples','Sauces & essentials','Snacks & other food'];container.innerHTML=groups.map(g=>{const products=items.filter(i=>group(i)===g);return '<section class="shelf-unit"><div class="shelf-heading"><h2>'+g+'</h2><small>'+products.length+' items</small></div><div class="shelf-cabinet"><div class="shelf-products">'+(products.length?products.map(i=>{const below=i.current!=null&&i.optimum!=null&&Number(i.current)<Number(i.optimum);const qty=i.current==null?'Not counted':(i.unit==='£'?'£'+i.current:i.current+' '+(i.unit||''));return '<button class="product '+(below?'is-low ':'')+(i.current==null?'is-empty':'')+'" data-shape="'+shape(i)+'" data-id="'+safe(i.id)+'" aria-label="'+safe(i.name)+', '+safe(qty)+(below?', below target':'')+'"><span class="product-art" aria-hidden="true">'+art(i)+'</span><span class="product-name">'+safe(i.name)+'</span><span class="product-count">'+safe(qty)+'</span></button>'}).join(''):'<span class="empty-shelf">Nothing recorded here yet</span>')+'</div></div></section>'}).join('')}
place.addEventListener('change',render);search.addEventListener('input',render);container.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)location.href='./index.html#item='+encodeURIComponent(b.dataset.id);});render();
</script></body></html>
